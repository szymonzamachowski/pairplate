<!-- Micro-interaction Script -->
<script>
        function selectProfile(type) {
            const body = document.body;
            // Immediate haptic feedback simulation via scaling (CSS handles)
            
            // Temporary overlay for transition
            const overlay = document.createElement('div');
            overlay.className = `fixed inset-0 z-[100] transition-opacity duration-700 opacity-0 ${type === 'blue' ? 'bg-tertiary-container' : 'bg-secondary-container'}`;
            document.body.appendChild(overlay);
            
            setTimeout(() => {
                overlay.style.opacity = '1';
                setTimeout(() => {
                    // Logic for redirection would go here
                    console.log(`Profile ${type} selected`);
                }, 700);
            }, 50);
        }

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.profile-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 200 + (index * 150));
            });
        });
    </script>
<!-- Atmospheric Effect: Very subtle floating bubbles -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30">
<div class="absolute w-64 h-64 bg-primary-container/20 rounded-full blur-[100px] -top-32 -left-32 animate-pulse"></div>
